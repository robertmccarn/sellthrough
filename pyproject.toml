[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sellthrough"
version = "0.1.0"
description = "Personal eBay resale market intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.33.0,<3",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7.0,<3",
  "pytest>=8.0.0,<9",
]
web = [
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "jinja2>=3.1.0,<4",
  "uvicorn>=0.30.0,<1",
]

[project.scripts]
sellthrough = "sellthrough.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
