[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sellthrough"
version = "0.1.0"
description = "Personal eBay resale market intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0,<3",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7.0,<3",
]

[project.scripts]
sellthrough = "sellthrough.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
